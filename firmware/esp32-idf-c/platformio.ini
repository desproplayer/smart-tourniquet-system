; PlatformIO Project Configuration File
; Smart Tourniquet System — Firmware ESP32-S3 (C murni, ESP-IDF)
; Kelompok 19 — Desain Proyek Teknik Elektro, Komputer, Biomedik 2
;
; PENTING: framework = espidf (BUKAN arduino). Arduino API (Serial, Wire, dst) adalah
; objek C++ dan tidak bisa dipakai dari file .c murni -- makanya firmware ini ditulis
; total pakai ESP-IDF native C API (driver/gpio.h, driver/i2c.h, driver/ledc.h, dst).

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
